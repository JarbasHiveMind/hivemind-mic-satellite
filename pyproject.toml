[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-mic-satellite"
description = "Remote microphone for HiveMind"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest", "pytest-timeout", "hivescope==0.3.0a1"]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-mic-satellite"

[project.scripts]
hivemind-mic-sat = "hivemind_mic_sat:run"

[tool.setuptools]
packages = ["hivemind_mic_sat"]
include-package-data = true

[tool.setuptools.package-data]
hivemind_mic_sat = ["res/snd/*.wav", "res/snd/*.mp3"]

[tool.setuptools.dynamic]
version = { attr = "hivemind_mic_sat.version.__version__" }
dependencies = { file = ["requirements.txt"] }
